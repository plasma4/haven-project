<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>buggy bounce</title>
    <script type="module" src="index.ts" defer></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #05070b;
            color: #e5e7eb;
            font: 14px/1.5 monospace;
        }

        body::before {
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            width: 420px;
            height: 320px;
            background-image: radial-gradient(#90a4b538 1.5px, transparent 2px);
            background-size: 20px 20px;
            mask-image: radial-gradient(ellipse at top left, #000 0%, transparent 76%);
            content: "";
            pointer-events: none;
        }

        canvas {
            position: fixed;
            inset: 0;
        }

        #hud {
            position: fixed;
            z-index: 2;
            top: 14px;
            right: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 1px solid #56616d;
            background: #080d13e8;
        }

        #hud img {
            width: 24px;
            height: 24px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            /* u need both */
        }

        #progress {
            position: fixed;
            z-index: 2;
            left: 14px;
            bottom: 12px;
            color: #c1ccd5;
            font-size: 11px;
            pointer-events: none;
        }

        #spinInfo {
            position: fixed;
            z-index: 3;
            top: 14px;
            left: 14px;
            padding: 10px 14px;
            color: #fff3d6;
            background: #402000e8;
            border: 2px solid #ff9b24;
            box-shadow: 0 0 18px #ff8a3380;
            font: bold 13px/1.55 monospace;
            pointer-events: none;
        }

        #buggy-log {
            position: fixed;
            z-index: 4;
            right: 12px;
            bottom: 12px;
            padding: 8px 10px;
            color: #0c583e;
            background: #ddeee8e8;
            border: 1px solid #53d2ae;
            font: 11px/1.45 monospace;
            white-space: pre;
            pointer-events: none;
        }

        #hitbox-controls {
            position: fixed;
            z-index: 4;
            right: 12px;
            bottom: 138px;
            padding: 5px 8px;
            color: #ecdbe8;
            background: #04140fe8;
            border: 1px solid #8c3b7b;
            font: 11px/1.3 monospace;
        }

        #shop {
            position: fixed;
            z-index: 3;
            top: 50%;
            right: 22px;
            transform: translateY(-50%);
            width: min(330px, calc(100vw - 24px));
            min-height: min(80vh, 900px);
            padding: 18px;
            border: 3px solid #ff7a00;
            background: #8a3d0026;
            box-shadow: 0 0 24px #ff7a0066, inset 0 0 0 1px #ffb34766;
        }

        #shop[hidden] {
            display: none;
        }

        #shop h2,
        #shop p {
            margin: 0 0 10px;
        }

        #shop button {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            color: #e5e7eb;
            background: #17212b;
            border: 1px solid oklab(76.045% -0.15303 0.10387);
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        #shop button:hover:not(:disabled) {
            background: #273b49;
        }

        #shop button:disabled {
            opacity: .45;
            cursor: default;
        }

        .muted {
            color: #9aa8b4;
        }

        #reward-image {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            background: #000;
            z-index: 9;
        }
    </style>
</head>

<body>
    <canvas></canvas>
    <div id="hud"><img src="/money.png" alt=""><span><b id="currency-value">0</b></span></div>
    <div id="progress"></div>
    <div id="spinInfo" hidden></div>
    <label id="hitbox-controls">
        <pre id="debug-log"
            aria-live="off">This is RAGEBAIT BOUNCE. try to beat the bugs and bounce back to the initial area to win!</pre>
        <input id="show-hitboxes" type="checkbox"> Unshow no hitboxes
    </label>
    <section id="shop" hidden>
        <h2>circly upgrades!</h2>
        <p class="muted">spend yer money (you cant)</p>
        <button data-upgrade="spin" data-label="Spin speed +50%"></button>
        <!-- <button data-upgrade="drive" data-label="Drive +20%"></button>
        <button data-upgrade="spring" data-label="Spring +bounce"></button> -->
        <button data-upgrade="payout" data-label="Money reward x2"></button>
        <p class="muted">(goog is awaiting)</p>
    </section>
    <img id="reward-image" src="/oooo.jpg" alt="" hidden>
    </section>
</body>

</html>
